name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  macos:
    # Apple Silicon runner: Aeri targets arm64 first.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # cef-dll-sys builds CEF's C++ wrapper with CMake and Ninja.
      - run: brew install ninja
      - uses: Swatinem/rust-cache@v2
      # Without CEF_PATH, the cef crate's build script downloads CEF itself.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask bundle
      - run: codesign --verify --deep --strict target/bundle/aeri.app

  windows-core:
    name: Windows (aeri-core)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p aeri-core
